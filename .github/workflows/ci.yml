name: CI

on:
  # 所有分支 push 都跑：agent/* 开发分支需要靠 CI 实测平台行为
  #（见 spawn-dsh-windows-output-pipe：Windows 行为必须实机验证）。
  push:
    branches: ['**']
  pull_request:

env:
  # 冒烟装哪个 dsh：**钉死具体版本**，不走 `@next` / 浮动范围。
  # 2026-09-22 那次三平台整条红在装 dsh 这一步：`@next`（0.1.5-rc.3）的某个子包依赖范围
  # （`@deepseek-ai/dsh-client-ui-sidebar-documentpreview@^0.1.5-rc.3`）当时在 registry 上
  # 取不到，npm 直接 notarget。上游按批次发，同一批里个别子包晚几步到 registry 就会这样；
  # 钉一个「整批都已发全、且 README『dsh 版本兼容跟踪』里实测过」的版本最省事。
  # 换版本时先在本机确认：npm i -g --prefix /tmp/dsh-pin @deepseek-ai/dsh@<版本>，
  # 再用 /tmp/dsh-pin/bin/dsh --version 打到出版本号。
  DSH_SMOKE_VERSION: '0.1.6-alpha.2'

jobs:
  ci:
    strategy:
      fail-fast: false
      # 三平台矩阵：每个 OS 都跑 typecheck + test + build + package + spawn 冒烟，
      # 覆盖 src/server/ 真正的平台分歧点（Windows dsh.cmd 分派、mac/POSIX detached spawn）。
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      # spawnDsh 冒烟：先全局装 dsh（所有平台都装，是前提），再按平台分支验证。
      # - mac/ubuntu：detached 启动器 spawn dsh --version，验证 POSIX detached spawn。
      # - windows：经 spawnDsh.js 跑 dsh --version 并验证日志非空（spawn-dsh-windows-output-pipe），
      #   同时保留 PowerShell 直跑作对照（验证「Windows 上 dsh 可用」）。
      - name: Install dsh (spawn smoke)
        shell: bash
        # 装的版本钉在文件头 env.DSH_SMOKE_VERSION；这里除了装，还要在失败时把
        # 「上游某个包的依赖范围在 registry 上取不到」这一种原因点出来（2026-09-22
        # 就是它把三平台一起弄红的，原文只有一行 npm notarget，看不出该换版本）。
        run: |
          echo "装 @deepseek-ai/dsh@${DSH_SMOKE_VERSION}（钉死的版本，理由见文件头 env 注释）"
          if OUT="$(npm i -g "@deepseek-ai/dsh@${DSH_SMOKE_VERSION}" 2>&1)"; then
            printf '%s\n' "$OUT"
            echo "installed @deepseek-ai/dsh@${DSH_SMOKE_VERSION}"
            exit 0
          fi
          printf '%s\n' "$OUT"
          echo "--- 装 dsh 失败的诊断 ---"
          MISSING="$(printf '%s\n' "$OUT" | grep -o 'No matching version found for [^ ]*' | head -1)"
          if [ -n "$MISSING" ]; then
            echo "上游有包装不上：${MISSING}"
            echo "钉住的版本是 @deepseek-ai/dsh@${DSH_SMOKE_VERSION}——这一批发出来时某个子包的对应"
            echo "版本在 registry 上取不到（晚发或已撤），不是本仓代码的问题。换一个整批发全的版本："
            echo "  1) npm view @deepseek-ai/dsh versions --json   # 有哪些版本"
            echo "  2) npm view @deepseek-ai/dsh dist-tags --json  # latest / next / alpha 各指哪个版本"
            echo "  3) 本机试装：npm i -g --prefix /tmp/dsh-pin @deepseek-ai/dsh@<版本>，"
            echo "     再用 /tmp/dsh-pin/bin/dsh --version 确认能跑出版本号"
            echo "  4) 改 .github/workflows/ci.yml 的 env.DSH_SMOKE_VERSION；别改回 @next 或浮动范围"
          else
            echo "失败原因不是上面那种依赖范围取不到，看上面的 npm 输出。"
          fi
          exit 1
      - name: 'Spawn dsh smoke (posix: detached spawn)'
        if: runner.os != 'Windows'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/dsh-smoke.log"
          rm -f "$LOG"
          PID="$(node dist/spawnDsh.js dsh "$LOG" --version)"
          test -n "$PID" || { echo "launcher returned no pid"; exit 1; }
          echo "spawned dsh pid=$PID"
          # 轮询等待版本输出：dsh 冷启动（尤其 Windows .cmd→node→CLI）可能 >3s，
          # 固定 sleep 3 不够。最多等 ~20s，每 2s 检查一次，命中即 break；
          # mac/ubuntu 首次检查即命中，不受影响（甚至比原来固定 sleep 3 更快）。
          ok=0
          for i in $(seq 1 11); do
            if [ -f "$LOG" ] && grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+|version' "$LOG"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" = "1" ]; then
            echo "dsh smoke OK"
          else
            # 失败诊断：区分「PATH 里没有 dsh」vs「冷启动慢」vs「spawn 输出没落到日志」。
            # npm bin 在 npm 9+ 已移除，用 npm prefix -g 定位全局 bin 目录。
            echo "dsh produced no version output within ~20s; log:"
            cat "$LOG" 2>&1
            echo "--- diagnostics ---"
            echo "node -v: $(node -v)"
            echo "which dsh: $(command -v dsh 2>&1 || echo '(not on PATH)')"
            echo "npm prefix -g: $(npm prefix -g 2>&1)"
            NPREFIX="$(npm prefix -g 2>/dev/null)"
            echo "npm global bin listing:"
            ls "$NPREFIX/bin" 2>/dev/null || ls "$NPREFIX" 2>/dev/null || echo "(cannot list npm global bin dir)"
            echo "log size (bytes): $(wc -c < "$LOG" 2>/dev/null || echo 0)"
            echo "PATH: $PATH"
            # 对照：非 spawn 路径直接跑一次 dsh --version，帮忙区分 PATH/冷启动 与 spawn 管道问题。
            echo "--- control: dsh --version directly (non-spawn) ---"
            if command -v dsh >/dev/null 2>&1; then
              if command -v timeout >/dev/null 2>&1; then
                timeout 15 dsh --version 2>&1 || echo "(control dsh --version exited non-zero: $?)"
              else
                dsh --version 2>&1 || echo "(control dsh --version exited non-zero: $?)"
              fi
            else
              echo "dsh not on PATH; cannot run control"
            fi
            exit 1
          fi
      - name: 'Spawn dsh smoke (windows: via spawnDsh.js)'
        if: runner.os == 'Windows'
        shell: pwsh
        # spawn-dsh-windows-output-pipe 的验收：经 dist/spawnDsh.js 跑 dsh --version，
        # 轮询日志文件出版本号（detached + cmd 包装的输出链恢复，日志非空才算过）。
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dsh-smoke.log'
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          $pidOut = node dist/spawnDsh.js dsh $log --version
          if (-not $pidOut) { Write-Error "launcher returned no pid"; exit 1 }
          Write-Host "spawned dsh pid=$pidOut"
          # 轮询等待版本输出：dsh 冷启动可能 >3s，最多等 ~20s，每 2s 检查一次。
          $ok = $false
          for ($i = 0; $i -lt 11; $i++) {
            if ((Test-Path $log) -and ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'v?\d+\.\d+\.\d+')) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if ($ok) {
            Write-Host "dsh smoke OK"
          } else {
            Write-Host "dsh produced no version output within ~20s; log:"
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log file)" }
            Write-Host "--- diagnostics ---"
            Write-Host "node -v: $(node -v)"
            Get-Command dsh -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-List
            Write-Host "npm prefix -g: $(npm prefix -g 2>&1)"
            Write-Host "log size (bytes): $((Get-Item $log -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Length))"
            # 对照：非 spawn 路径直接跑一次 dsh --version，区分 PATH/冷启动 与 spawn 输出链问题。
            Write-Host "--- control: dsh --version directly (non-spawn) ---"
            dsh --version
            if ($LASTEXITCODE -ne 0) { Write-Error "control dsh --version failed: $LASTEXITCODE" }
            exit 1
          }
