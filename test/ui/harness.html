<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH One — chat webview 视觉场景</title>
<link rel="stylesheet" href="/test/ui/style.css">
<style>body { margin: 0; font-family: sans-serif; } #app { min-height: 100vh; }</style>
</head>
<body>
<div id="app"></div>

<!-- mock 宿主 API：webview 只用到 postMessage，这里吞掉发回宿主的动作 -->
<script>window.acquireVsCodeApi = function () { return { postMessage: function () {} } }</script>

<script src="/dist/chatWebview.js"></script>
<script src="/test/ui/scenarios.js"></script>

<script>
  // 按 ?scenario=<name> 选场景；默认 conversation。装载后把该场景的
  // sessions / state / modelCatalog 推给 webview，得到对应界面状态。
  const q = new URLSearchParams(location.search)
  const name = q.get('scenario') || window.DEFAULT_SCENARIO
  const scen = window.SCENARIOS[name] || window.SCENARIOS[window.DEFAULT_SCENARIO]
  const post = (m) => window.postMessage(m, '*')
  window.addEventListener('load', () => {
    post({ type: 'sessions', snapshot: scen.sessions || window.sessionsTree(scen.state && scen.state.sessionId) })
    post({ type: 'state', state: scen.state })
    if (scen.modelCatalog) post({ type: 'modelCatalog', catalog: scen.modelCatalog })
  })
</script>
</body>
</html>
