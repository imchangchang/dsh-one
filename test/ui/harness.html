<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH One — webview 视觉场景</title>
<!-- style.css 与 scenarios.js 同款防缓存：加载后由脚本换成带时间戳的 URL -->
<link rel="stylesheet" href="/test/ui/style.css?v=__STYLE_BUST__">
<script>
  (() => {
    const link = document.querySelector('link[rel="stylesheet"]')
    if (link) link.href = `/test/ui/style.css?v=${Date.now()}`
  })()
</script>
<style>
  body { margin: 0; font-family: sans-serif; }
  #app { min-height: 100vh; }
  /* 场景可选 theme:'dark'：替代 VS Code 注入的 --vscode-* 变量，模拟暗色界面。 */
  body[data-theme='dark'] {
    --vscode-editor-background: #1e1e1e;
    --vscode-foreground: #cccccc;
    --vscode-input-background: #2d2d30;
    --vscode-input-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-panel-border: rgba(127,127,127,.35);
    --vscode-textLink-foreground: #4daafc;
    --vscode-charts-blue: #4daafc;
    --vscode-focusBorder: #4daafc;
    --vscode-textCodeBlock-background: rgba(255,255,255,.1);
    background: #1e1e1e; color: #cccccc;
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- mock 宿主 API：webview 只用到 postMessage，这里吞掉发回宿主的动作（记录到
     window.__posted 供场景/调试检查） -->
<script>window.acquireVsCodeApi = function () { return { postMessage: function (m) { (window.__posted = window.__posted || []).push(m) } } }</script>

<script>
  // 子资源统一带 ?v=Date.now() 防缓存：python http.server 不设 Cache-Control，
  // 浏览器启发式缓存会把旧 scenarios.js / dist 拿来用——改了场景或重建 dist 后
  // 重跑还拿到旧文件，白白浪费一轮截图。场景文件必须在 bundle 之前就绪。
  const bust = `?v=${Date.now()}`
  const scenScript = document.createElement('script')
  scenScript.src = `/test/ui/scenarios.js${bust}`
  scenScript.onload = () => {
    // 按 ?scenario=<name> 选场景；默认 conversation。场景可选 view 字段：
    //   view: 'sessions' → 加载侧栏 sessions 面板 bundle（dist/sessionsWebview.js），
    //   只投喂 sessions 快照；缺省（chat webview）投喂 sessions/state/modelCatalog。
    // 场景可选 interact 字段（一段 JS 字符串）：快照投喂后延迟执行，用于模拟
    // 点击打开菜单/进入行内重命名等交互态，再被脚本截图。
    // 场景可选 interactSteps 字段（[{name, script, settle?}]，与 interact 二选一、
    // 同时存在时优先）：分步交互——每步 script 执行并等待 settle 毫秒（默认 500）
    // 后置 window.__interactStepDone = name（完成信号），ui-visual.sh 轮询到信号
    // 截图该步，再调 window.__interactStepAdvance() 放行下一步（截图管线的握手
    // 协议见 scripts/ui-visual.sh）。所有步骤执行完后 advance 为空操作。
    const q = new URLSearchParams(location.search)
    const name = q.get('scenario') || window.DEFAULT_SCENARIO
    const scen = window.SCENARIOS[name] || window.SCENARIOS[window.DEFAULT_SCENARIO]
    if (scen.theme === 'dark') document.body.setAttribute('data-theme', 'dark')
    const post = (m) => window.postMessage(m, '*')
    const bundle = (scen.view === 'sessions' ? '/dist/sessionsWebview.js' : '/dist/chatWebview.js') + bust
    const s = document.createElement('script')
    s.src = bundle
    s.onload = () => {
      post({ type: 'sessions', snapshot: scen.sessions || window.sessionsTree(scen.state && scen.state.sessionId) })
      if (scen.state) post({ type: 'state', state: scen.state })
      if (scen.modelCatalog) post({ type: 'modelCatalog', catalog: scen.modelCatalog })
      if (scen.interactSteps && scen.interactSteps.length > 0) {
        // 分步握手：先置空信号再执行本步脚本；脚本同步返回不代表 UI 稳定，
        // settle 后（需长异步链的步骤在场景里调大）才推完成信号。
        const steps = scen.interactSteps
        let idx = -1
        window.__interactStepDone = null
        window.__interactStepAdvance = () => {
          idx += 1
          if (idx >= steps.length) return
          window.__interactStepDone = null
          ;(0, eval)(steps[idx].script)
          setTimeout(() => { window.__interactStepDone = steps[idx].name }, steps[idx].settle ?? 500)
        }
        setTimeout(() => window.__interactStepAdvance(), 300)
      } else if (scen.interact) {
        setTimeout(() => (0, eval)(scen.interact), 300)
      }
    }
    document.head.appendChild(s)
  }
  document.head.appendChild(scenScript)
</script>
</body>
</html>
